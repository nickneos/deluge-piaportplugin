name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.12'
    - name: Install build dependencies
      run: python3 -m pip install --upgrade pip "setuptools<70" wheel setuptools-git-versioning
    - name: Build egg
      run: python3 setup.py bdist_egg
    - name: Create Release and Upload Egg
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.egg
